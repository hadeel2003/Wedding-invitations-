<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;500&family=Pinyon+Script&display=swap">
<style>
:root{--paper:#e9e7e2;--paper2:#bdbab3;--wine:#7a2b3c;--ink:#6b6a66;--env:#5a1f2b;--env2:#6f2a39;--gold:#b8923f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:var(--wine)}
#stage{position:relative;height:100%;background:linear-gradient(180deg,#f0eee9 0%,#e4e2dc 55%,var(--paper2) 100%);overflow:hidden}
.scene{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity 1.2s ease;pointer-events:none;padding:0 24px}
.scene.on{opacity:1;pointer-events:auto}
.sm{font-family:'Cinzel',Georgia,serif;letter-spacing:.35em;font-size:clamp(12px,3.6vw,16px);margin:6px 0}
.big{font-family:'Cinzel',Georgia,serif;font-size:clamp(30px,10vw,48px);letter-spacing:.12em;color:var(--ink);margin:10px 0}
.script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:clamp(56px,19vw,92px);line-height:.95;color:var(--ink);margin:0}
.amp{font-family:'Pinyon Script',cursive;font-size:clamp(44px,14vw,66px);color:#b79aa0;margin:-6px 0}
.date{font-size:clamp(26px,8vw,38px);letter-spacing:.08em;color:var(--ink);margin:0 0 26px}
.det{font-size:clamp(15px,4.4vw,19px);letter-spacing:.14em;text-transform:uppercase;margin:6px 0}
.btn{margin-top:30px;display:inline-block;padding:12px 26px;border:1px solid var(--wine);color:var(--wine);text-decoration:none;font-family:'Cinzel',Georgia,serif;letter-spacing:.2em;font-size:13px;border-radius:2px}
#bf{position:absolute;left:50%;top:46%;width:min(62vw,260px);transform:translate(-50%,-50%) scale(.4);opacity:0;transition:top 1.8s cubic-bezier(.5,0,.2,1),transform 1.8s cubic-bezier(.5,0,.2,1),opacity .8s;filter:drop-shadow(0 8px 6px rgba(80,60,40,.25));z-index:2}
#bf.out{opacity:1;top:17%;transform:translate(-50%,-50%) scale(1)}
.wing{transform-origin:100px 70px;animation:flap .45s ease-in-out infinite alternate}
#bf.out.calm .wing{animation-duration:2.6s}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
#env{position:absolute;left:50%;top:50%;width:min(76vw,300px);aspect-ratio:3/4;transform:translate(-50%,-50%);transition:transform 1.4s ease,opacity 1.2s ease;z-index:3;cursor:pointer;perspective:900px}
#env.gone{transform:translate(-50%,40%);opacity:0;pointer-events:none}
#env .back,#env .front,#env .flap{position:absolute;inset:0}
#env .back{background:var(--env);border-radius:4px;box-shadow:0 18px 40px rgba(60,20,30,.35)}
#env .front{background:var(--env2);clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%)}
#env .flap{height:56%;background:#4a1823;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease .1s;z-index:2}
#env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3c783,var(--gold));z-index:3;display:flex;align-items:center;justify-content:center;color:#5a1f2b;font-size:22px;transition:opacity .4s}
#env.open .seal{opacity:0}
#hint{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-family:'Cinzel',Georgia,serif;letter-spacing:.3em;font-size:12px;color:var(--wine);animation:pulse 2s infinite;z-index:4;transition:opacity .5s}
@keyframes pulse{50%{opacity:.35}}
#replay{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--ink);font-size:12px;letter-spacing:.15em;opacity:0;transition:opacity 1s;cursor:pointer;font-family:'Cinzel',Georgia,serif;z-index:5}
#mute{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--wine);background:rgba(255,255,255,.4);color:var(--wine);font-size:18px;cursor:pointer;z-index:6;opacity:0;transition:opacity 1s}
#mute.off{text-decoration:line-through;opacity:.5!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#e9e7e2}}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dfe4"/><stop offset="1" stop-color="#e9b9c4"/></linearGradient>
    <g id="w">
      <path d="M100 70C118 30 158 10 192 22C197 52 170 82 128 88Z" fill="url(#pk)" stroke="#b8923f" stroke-width="3"/>
      <path d="M100 74C125 80 152 95 150 118C126 130 108 108 100 80Z" fill="url(#pk)" stroke="#b8923f" stroke-width="3"/>
      <path d="M104 68L184 28M104 72L190 48M104 76L160 76M104 80L146 108" stroke="#b8923f" stroke-width=".9" fill="none"/>
      <path d="M192 24C196 52 170 82 128 88" stroke="#b8923f" stroke-width="6" stroke-dasharray="2 4" fill="none" opacity=".8"/>
    </g></defs></svg>

  <svg id="bf" viewBox="0 0 200 140" aria-hidden="true">
    <g class="wing"><use href="#w"/></g>
    <g transform="translate(200,0) scale(-1,1)"><g class="wing"><use href="#w"/></g></g>
    <path d="M100 52C96 52 96 62 98 90C99 100 101 100 102 90C104 62 104 52 100 52Z" fill="#7a5a1e"/>
    <path d="M99 54C90 34 82 28 76 24M101 54C110 34 118 28 124 24" stroke="#5a4416" stroke-width="1.2" fill="none"/>
  </svg>

  <div class="scene" id="s1">
    <div class="sm" style="margin-top:34vh">YOU'RE</div>
    <div class="big">CORDIALLY</div>
    <div class="sm">INVITED</div>
  </div>

  <div class="scene" id="s2">
    <div class="sm" style="margin-top:24vh">WE'RE GETTING MARRIED</div>
    <p class="script" style="margin-top:22px">Adele</p>
    <div class="amp">&amp;</div>
    <p class="script">Oliver</p>
  </div>

  <div class="scene" id="s3">
    <div class="sm" style="margin-top:22vh">SAVE THE DATE</div>
    <p class="date" style="margin-top:16px">DECEMBER 25, 2026</p>
    <div class="det">11:00 AM – 07:00 PM</div>
    <div class="det">Love Gardens Villa</div>
    <div class="det">Pearlsville CA 1238 Miami</div>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Love+Gardens+Villa+Miami">VIEW LOCATION</a>
  </div>

  <div id="env"><div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div></div>
  <div id="hint">TAP TO OPEN</div>
  <button id="replay">REPLAY</button>
  <button id="mute" aria-label="Music on/off">♪</button>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var env=$('env'),bf=$('bf'),hint=$('hint'),rp=$('replay'),T=[],busy=false;
  function at(ms,fn){T.push(setTimeout(fn,ms))}
  function show(id,on){$(id).classList.toggle('on',on)}
  function play(){
    if(busy)return;busy=true;hint.style.opacity=0;music.start();
    env.classList.add('open');
    at(500,function(){bf.classList.add('out')});
    at(900,function(){env.classList.add('gone')});
    at(2400,function(){bf.classList.add('calm')});
    at(2200,function(){show('s1',true)});
    at(5200,function(){show('s1',false)});
    at(6200,function(){show('s2',true)});
    at(9600,function(){show('s2',false)});
    at(10600,function(){show('s3',true);rp.style.opacity=1});
  }
  function reset(){
    T.forEach(clearTimeout);T=[];busy=false;
    ['s1','s2','s3'].forEach(function(i){show(i,false)});
    bf.classList.remove('out','calm');env.classList.remove('open','gone');
    hint.style.opacity=1;rp.style.opacity=0;
  }

  var music=(function(){
    var ctx,master,timer,step=0,next=0,on=true,started=false;
    var m=function(n){return 440*Math.pow(2,(n-69)/12)};
    var bars=[[60,64,67,72,76,72,67,64],[55,59,62,67,71,67,62,59],[57,60,64,69,72,69,64,60],[53,57,60,65,69,65,60,57]];
    var mel=[[76,79],[74,71],[72,76],[69,72]];
    function note(f,t,d,v){
      [[f,'triangle',1],[f*2,'sine',.35]].forEach(function(o){
        var os=ctx.createOscillator(),g=ctx.createGain();
        os.type=o[1];os.frequency.value=o[0];
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*o[2],t+.01);
        g.gain.exponentialRampToValueAtTime(.0001,t+d);
        os.connect(g);g.connect(master);os.start(t);os.stop(t+d+.05);
      });
    }
    function sched(){
      var eighth=60/72/2;
      while(next<ctx.currentTime+.6){
        var bar=Math.floor(step/8)%4,i=step%8;
        note(m(bars[bar][i]),next,1.6,.16);
        if(i===0)note(m(bars[bar][0]-12),next,2.8,.12);
        if(i===0)note(m(mel[bar][0]),next,2.2,.14);
        if(i===4)note(m(mel[bar][1]),next,2.2,.12);
        next+=eighth;step++;
      }
    }
    return{
      start:function(){
        if(started)return;started=true;
        try{
          var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
          master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
          var dl=ctx.createDelay();dl.delayTime.value=.34;var fb=ctx.createGain();fb.gain.value=.38;
          var wet=ctx.createGain();wet.gain.value=.5;
          master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ctx.destination);
          master.gain.linearRampToValueAtTime(.7,ctx.currentTime+3);
          next=ctx.currentTime+.1;sched();timer=setInterval(sched,150);
          document.getElementById('mute').style.opacity=1;
        }catch(e){}
      },
      toggle:function(){
        if(!ctx)return;on=!on;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.linearRampToValueAtTime(on?.7:0,ctx.currentTime+.4);
        document.getElementById('mute').classList.toggle('off',!on);
      },
      pause:function(h){if(!ctx)return;h?ctx.suspend():ctx.resume()}
    };
  })();
  $('mute').addEventListener('click',music.toggle);
  document.addEventListener('visibilitychange',function(){music.pause(document.hidden)});
  env.addEventListener('click',play);
  rp.addEventListener('click',reset);
})();
</script>
</body>
</html>
